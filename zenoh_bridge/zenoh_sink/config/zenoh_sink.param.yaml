/**:
  ros__parameters:
    qos_depth: 10
    subscriptions_yaml: |
      - topic_name: /demo/chatter
        msg_type: std_msgs/msg/String
        zenoh_name: custom/zenoh/key
      - topic_name: /demo/number
        msg_type: std_msgs/msg/Int32
    metrics.enabled: true
    metrics.interval_ms: 1000
    metrics.topic: "zenoh_sink/metrics"
    # Session role: peer (default, gossip discovery), client (connect to a router), or router.
    zenoh.mode: "peer"
    # Endpoints to actively connect to (required in client mode). Leave unset for none
    # (an empty YAML list [] cannot be type-inferred by ROS 2 and is rejected). Example:
    # zenoh.connect: ["tcp/localhost:7447"]
    # Endpoints to listen on, e.g. zenoh.listen: ["tcp/0.0.0.0:7447"]
    # Optional path to a full zenoh JSON5 config file; mode/connect/listen are applied on top.
    zenoh.config_path: ""
    zenoh.key_prefix: "ros2"
    zenoh.topic_mapping_mode: "prefix_ros_topic"
    zenoh.fixed_keyexpr: "ros2/raw"
    zenoh.payload_format: "cdr"
    # Per-publisher options. congestion_control: drop (never block the ROS callback) or block.
    zenoh.congestion_control: "drop"
    # priority: 1 (real-time) .. 7 (background); 5 == DATA (zenoh default).
    zenoh.priority: 5
    zenoh.express: false
    # optional: when set, overrides header.frame_id in published messages (for nebula parsing)
    # zenoh.message_key: ""
