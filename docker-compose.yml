services:
  broker:
    image: confluentinc/cp-kafka:latest
    hostname: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LISTENERS: "INTERNAL://broker:29092,CONTROLLER://broker:29093,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/broker/29092"]
      interval: 10s
      timeout: 5s
      retries: 6

  dispatcher:
    image: ${DISPATCHER_IMAGE:-ros2-kafka-dispatcher:local}
    network_mode: host
    ipc: host
    depends_on:
      broker:
        condition: service_healthy
    command:
      - ros2
      - launch
      - ros2_kafka_dispatcher_bringup
      - system_minimal.launch.py
      - selection_mode:=file
      - selection_file_path:=/ws/install/share/ros2_kafka_dispatcher_bringup/config/selection_smoke.yaml
      - kafka_sink_param_file:=/ws/install/share/ros2_kafka_dispatcher_bringup/config/kafka_sink_smoke.yaml
      - enable_mosquitto_sink:=false
      - enable_zenoh_sink:=false
      - controller_log_level:=info
      - kafka_sink_log_level:=info
      - introspection_manager_log_level:=INFO
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "source /opt/ros/${ROS_DISTRO:-humble}/setup.bash && source /ws/install/setup.bash && ros2 service list | grep -q '^/dispatcher_controller/get_status$'"
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s
