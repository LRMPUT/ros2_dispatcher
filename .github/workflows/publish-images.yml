name: Publish Docker images to GHCR

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: lrmput

jobs:
  build-dispatcher:
    name: Build ros2-kafka-dispatcher
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate publish ref
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            exit 0
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/v* ]]; then
            exit 0
          fi
          echo "workflow_dispatch publishes are only allowed from main or version tags." >&2
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/ros2-kafka-dispatcher
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image (test)
        run: |
          docker buildx build \
            --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --file docker/Dockerfile \
            --build-arg ROS_DISTRO=humble \
            -t ${{ env.REGISTRY }}/${{ env.ORG }}/ros2-kafka-dispatcher:ci \
            .

      - name: Smoke test (runtime dependencies)
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.ORG }}/ros2-kafka-dispatcher:ci \
            bash -lc "set -eo pipefail; \
                      source /opt/ros/humble/setup.bash; \
                      source /ws/install/setup.bash; \
                      ros2 pkg executables kafka_sink >/dev/null; \
                      ros2 pkg executables mosquitto_sink >/dev/null; \
                      ! ldd /ws/install/lib/libkafka_sink.so | grep -q 'not found'; \
                      ! ldd /ws/install/lib/libmosquitto_sink.so | grep -q 'not found'; \
                      echo OK"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          build-args: ROS_DISTRO=humble
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
